[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docx2img"
version = "0.1.0"
description = "Pure Python DOCX to Image rendering engine"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "Pillow>=10.0",
    "fonttools>=4.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
office = [
    "pywin32>=306; platform_system=='Windows'",
]

[project.scripts]
docx2img = "docx2img.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
